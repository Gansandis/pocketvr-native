<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PocketVR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
video{position:fixed;left:-10px;top:0;width:2px;height:2px;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1220;z-index:5;text-align:center;padding:20px}
#start button{font-size:20px;padding:14px 36px;border-radius:30px;border:0;background:#4f8cff;color:#fff}
#start p{margin:0;opacity:.85;line-height:1.5}
#hud{position:fixed;left:8px;top:6px;font:11px monospace;opacity:.7;z-index:3;white-space:pre;pointer-events:none}
#web{position:fixed;left:6%;right:6%;top:5%;bottom:5%;z-index:4;display:flex;flex-direction:column;background:#1e1e21;border-radius:18px;overflow:hidden;touch-action:auto;box-shadow:0 0 0 2px #3a3a3f}
#web[hidden]{display:none}
#web.fl1,#web.fl2{top:14%;bottom:14%;width:42%;box-shadow:0 0 0 2px #4f8cff,0 8px 30px rgba(0,0,0,.6)}
#web.fl1{left:auto;right:3%}
#web.fl2{left:3%;right:auto}
#wbar{display:flex;gap:6px;padding:6px;align-items:center;background:#2a2a2e}
#wbar button{border:0;border-radius:12px;background:#3d3d43;color:#fff;font-size:18px;min-width:44px;height:40px}
#wbar button:active{background:#5a5a64}
#wurl{flex:1;min-width:0;height:40px;border:0;border-radius:12px;background:#111;color:#fff;padding:0 12px;font-size:15px}
#wframe{flex:1;border:0;background:#fff;touch-action:auto}
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">PocketVR</h2>
  <p>หมุนจอเป็นแนวนอน แล้วกดเริ่ม<br>อนุญาตกล้อง + เซนเซอร์เมื่อถูกถาม</p>
  <button id="go">เริ่ม</button>
  <p id="msg" style="font-size:13px"></p>
</div>
<div id="hud"></div>
<div id="web" hidden>
  <div id="wbar">
    <button id="wh" title="หน้าแรกของเว็บนี้">⌂</button>
    <input id="wurl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="wgo">ไป</button>
    <button id="wx" title="เปิดในแท็บใหม่">↗</button>
    <button id="wf" title="ลอย / เต็มจอ">◱</button>
    <button id="wc" title="ปิด">✕</button>
  </div>
  <iframe id="wframe" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
</div>
<video id="cam" playsinline muted autoplay></video>

<script type="module">
const MP_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MP_MODEL_CDN = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
let HandLandmarker, FilesetResolver, mpLocal = false;
// hand-tracking files: use the copy bundled inside the APK (mp/, works offline and starts fast); otherwise fall back to the internet
async function loadMediaPipe(){
  if (HandLandmarker) return;
  try{
    const r = await fetch('mp/hand_landmarker.task', {method:'HEAD'});
    if (r.ok){ const m = await import('./mp/vision_bundle.mjs'); HandLandmarker = m.HandLandmarker; FilesetResolver = m.FilesetResolver; mpLocal = true; return; }
  }catch(e){}
  const m = await import(MP_CDN + '/vision_bundle.mjs'); HandLandmarker = m.HandLandmarker; FilesetResolver = m.FilesetResolver; mpLocal = false;
}

const VERSION = 'v3.25';
const $ = id => document.getElementById(id);
const hud = $('hud'), video = $('cam');
const BG = 0x0b1220;
const IPDS = [0.058, 0.063, 0.068];
const PTS = [1.0, 1.4, 1.8, 0, -1], PT_N = ['เท่าจริง', 'ขยาย 1.4x', 'ขยาย 1.8x', 'เต็มจอ', 'ปิด (ห้องเสมือน)'];   // -1 = no camera picture in the VR box: zero-latency virtual room
const CQS = [[1280, 720, '720p'], [1920, 1080, '1080p คมสุด'], [854, 480, '480p ลื่นสุด']];   // camera resolution
const CMS = [0, 0.7, 1], CM_N = ['ปิด', 'ปานกลาง', 'มาก'];   // comfort vignette strength while the head turns
const camOn = () => S.mr && !(S.stereo && PTS[S.ptI] < 0);
const boxMode = () => S.mr && S.stereo && PTS[S.ptI] > 0;   // camera picture is a window floating inside the virtual room
const envShown = () => (!camOn() || boxMode()) && S.mode !== 'v360';   // passthrough size in the VR box
const CAMFOVS = [55, 62, 68, 75, 82], VFOVS = [70, 80, 90, 100];                                // real camera width angle / VR view angle (deg)
const baseFov = () => S.stereo ? VFOVS[S.vfI] : 70;
const QUAL = [0.75, 1, 1.5], QNAMES = ['ประหยัด', 'ปกติ', 'คมชัด'];
const S = {mr:false, stereo:false, ipd:0.063, mode:'home', tab:'all', score:0, cam:false, qi:1, pscale:1.15, page:0, sep:0.08, ptI:0, cfI:2, vfI:2, cmI:1, cqI:0};

/* --- dark-room support --- */
const NMODES = ['ปิด', 'อัตโนมัติ', 'สว่างสุด'], TMODES = ['ปิด', 'เปิด', 'อัตโนมัติ'];
const N = {mode:1, tm:0, lum:128, gain:1, gainT:1, dark:false, boosting:false, warn:false,
           torchOK:false, torchOn:false, ev:0, expCap:null, track:null, lastProbe:0, drawnVT:-1,
           pending:null, pendingFn:null, webFloat:0, swallow:false, webOpen:false, webUrl:'', msg:'', msgUntil:0};
const HAS_FILTER = 'filter' in CanvasRenderingContext2D.prototype;
const probeCv = document.createElement('canvas'); probeCv.width = 32; probeCv.height = 18;
const probeCtx = probeCv.getContext('2d', {willReadFrequently:true});
const boostCv = document.createElement('canvas'); boostCv.width = 960; boostCv.height = 540;
const bctx = boostCv.getContext('2d');
let boostTex = null;

/* --- phone apps (launched through Android deep links) and web shortcuts --- */
const APPS = [
  {n:'YouTube',     i:'▶️', pkg:'com.google.android.youtube',      link:'https://www.youtube.com/'},
  {n:'Spotify',     i:'🎵', pkg:'com.spotify.music',               link:'spotify://'},
  {n:'LINE',        i:'💬', pkg:'jp.naver.line.android',           link:'line://'},
  {n:'Facebook',    i:'📘', pkg:'com.facebook.katana',             link:'fb://'},
  {n:'Messenger',   i:'✉️', pkg:'com.facebook.orca',               link:'fb-messenger://'},
  {n:'Instagram',   i:'📷', pkg:'com.instagram.android',           link:'https://www.instagram.com/'},
  {n:'TikTok',      i:'🎬', pkg:'com.zhiliaoapp.musically',        link:'https://www.tiktok.com/'},
  {n:'Netflix',     i:'🍿', pkg:'com.netflix.mediaclient',         link:'https://www.netflix.com/'},
  {n:'Google Maps', i:'🗺', pkg:'com.google.android.apps.maps',    link:'https://maps.google.com/'},
  {n:'Discord',     i:'🎧', pkg:'com.discord',                     link:'https://discord.com/'}
];
const WEBS = [
  {n:'Wikipedia',     i:'📚', url:'https://th.wikipedia.org/'},
  {n:'แผนที่ OSM',    i:'🗺', url:'https://www.openstreetmap.org/export/embed.html?bbox=100.45%2C13.65%2C100.65%2C13.85&layer=mapnik'},
  {n:'DuckDuckGo',    i:'🔎', url:'https://html.duckduckgo.com/html/'},
  {n:'YouTube',       i:'▶️', url:'https://m.youtube.com/'},
  {n:'Facebook',      i:'📘', url:'https://m.facebook.com/'},
  {n:'Google',        i:'🔍', url:'https://www.google.com/'},
  {n:'TikTok',        i:'🎬', url:'https://www.tiktok.com/'},
  {n:'X (Twitter)',   i:'🐦', url:'https://x.com/'},
  {n:'Instagram',     i:'📷', url:'https://www.instagram.com/'}
];
const NOEMBED = /(^|\.)(youtube\.com|youtu\.be|facebook\.com|fb\.com|instagram\.com|tiktok\.com|twitter\.com|x\.com|netflix\.com|google\.com|line\.me|discord\.com|reddit\.com|linkedin\.com|spotify\.com|shopee\.co\.th|lazada\.co\.th)$/i;   // these refuse to open inside our floating browser
const BLOCKED_SCHEMES = /^(javascript|data|file|blob|about|vbscript):/i;
function loadList(k){ try{ const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function saveList(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let customApps = loadList('pvr_apps'), customWebs = loadList('pvr_webs');

/* --- tunables --- */
const PINCH_SETS = [[0.18, 0.30, 'แน่น'], [0.22, 0.34, 'กลาง'], [0.28, 0.42, 'หลวม']];   // [start, release, label]: thumb-index distance / palm size
const SMOOTH = [[2.5, 4, 'ไว'], [1.2, 3, 'กลาง'], [0.6, 2.5, 'นุ่ม']];                    // One-Euro filter [minCutoff, beta, label]
const RATE_MS = [33, 50, 80], RATE_N = ['เร็ว', 'กลาง', 'ประหยัด'];                          // minimum gap between hand detections
const GAZE_N = ['ปิด', 'เปิด', 'เฉพาะแบ่งจอ'], PTR_N = ['ปลายนิ้วชี้', 'กึ่งกลางนิ้วจีบ'], DEV_N = ['GPU', 'CPU'];
const LOST_MS = 650;      // keep the last hand pose this long after a missed detection
const HOLD_R = 0.45;      // while closing the fingers below this, the cursor stops moving (so it doesn't drift)
const HIT_SLOP = 8;       // extra px around every button (logical UI px)
const HAND_D = 1.1;       // distance (m) where the hand skeleton is drawn
const PANEL_R = 2.2, DOCK_R = 2.0;
const BASE_W = 2.0, BASE_H = 1.1 * 589 / 563;   // panel size (m) at scale 1
const PS_MIN = 0.6, PS_MAX = 2.0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* --- saved preferences --- */
const P = {gaze:0, ptr:0, smooth:1, rate:1, pinch:1, dev:0, two:1};
function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem('pvr_prefs') || '{}');
    for (const k of Object.keys(P)) if (Number.isInteger(o[k]) && o[k] >= 0) P[k] = o[k];
    P.gaze = Math.min(P.gaze, 2); P.ptr = Math.min(P.ptr, 1); P.smooth = Math.min(P.smooth, 2);
    P.rate = Math.min(P.rate, 2); P.pinch = Math.min(P.pinch, 2); P.dev = Math.min(P.dev, 1); P.two = Math.min(P.two, 1);
    if (Number.isInteger(o.qi) && o.qi >= 0) S.qi = Math.min(o.qi, 2);
    if (Number.isInteger(o.nm) && o.nm >= 0) N.mode = Math.min(o.nm, 2);
    if (IPDS.includes(o.ipd)) S.ipd = o.ipd;
    if (typeof o.sp === 'number') S.sep = clamp(o.sp, 0, 0.24);
    if (Number.isInteger(o.pt) && o.pt >= 0 && o.pt < PTS.length) S.ptI = o.pt;
    if (Number.isInteger(o.cf) && o.cf >= 0 && o.cf < CAMFOVS.length) S.cfI = o.cf;
    if (Number.isInteger(o.vf) && o.vf >= 0 && o.vf < VFOVS.length) S.vfI = o.vf;
    if (Number.isInteger(o.cm) && o.cm >= 0 && o.cm < CMS.length) S.cmI = o.cm;
    if (Number.isInteger(o.cq) && o.cq >= 0 && o.cq < CQS.length) S.cqI = o.cq;
    if (o.w !== 322) P.two = 1;   // v3.22: two-hand tracking + pinch zoom start enabled
    if (o.v !== 315) S.ptI = 3;   // v3.15: one-time reset to the full-screen camera picture (the look the user preferred)
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('pvr_prefs', JSON.stringify(Object.assign({}, P, {qi:S.qi, nm:N.mode, ipd:S.ipd, sp:S.sep, pt:S.ptI, cf:S.cfI, vf:S.vfI, cm:S.cmI, cq:S.cqI, v:315, w:322}))); }catch(e){}
}
loadPrefs();

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 6, 22);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 50);
scene.add(camera);
const stereo = new THREE.StereoCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, 2, 1); scene.add(sun);

const env = new THREE.Group(); scene.add(env);
const grid = new THREE.GridHelper(30, 30, 0x4f8cff, 0x1c2b4a); grid.position.y = -1.6; env.add(grid);

const heading = new THREE.Group(); scene.add(heading);
const groups = {shoot:new THREE.Group(), gallery:new THREE.Group()};
Object.values(groups).forEach(g => heading.add(g));

function applyQuality(){
  // in the VR box the lenses magnify the screen, so keep the picture sharp: never go below 1.25x there
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, S.stereo ? Math.max(QUAL[S.qi], 1.25) : QUAL[S.qi]));
  resize();
}

/* ---------- canvas UI toolkit ---------- */
function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
// W,H = logical size used by the drawing code; k = texture sharpness multiplier
const UITEX = [];
// split-screen view shrinks the panels a lot, so text needs mipmaps there; flat view skips them (cheaper uploads)
function applyTexFilter(tex){
  const on = !!(S.stereo && renderer.capabilities.isWebGL2);
  tex.generateMipmaps = on; tex.minFilter = on ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  tex.anisotropy = on ? Math.min(4, renderer.capabilities.getMaxAnisotropy()) : 1; tex.needsUpdate = true;
}
function makeUI(W, H, k, draw){
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W*k); canvas.height = Math.round(H*k);
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  applyTexFilter(tex); UITEX.push(tex);
  tex.magFilter = THREE.LinearFilter;
  const ui = {W, H, ctx, tex, regions:[], hover:null, press:null, dirty:true, mesh:null};
  ui.mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide, fog:false, depthWrite:false});
  ui.reg = (id, x, y, w, h, fn) => ui.regions.push({id, x, y, w, h, fn});
  ui.redraw = () => {
    ui.regions.length = 0;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    draw(ctx, ui);
    tex.needsUpdate = true; ui.dirty = false;
  };
  ui.at = uv => {
    const cx = uv.x*W, cy = (1-uv.y)*H;
    for (let i = ui.regions.length-1; i >= 0; i--){
      const r = ui.regions[i];
      if (cx >= r.x-HIT_SLOP && cx <= r.x+r.w+HIT_SLOP && cy >= r.y-HIT_SLOP && cy <= r.y+r.h+HIT_SLOP) return r;
    }
    return null;
  };
  return ui;
}
function invalidateUI(){ panel.dirty = true; dock.dirty = true; }

/* ---------- actions ---------- */
function toggleMR(){
  if (!S.cam) return;
  setMR(!S.mr);
  if (S.mr && S.stereo && PTS[S.ptI] < 0){ S.ptI = 3; savePrefs(); refreshBackground(); showToast('เปิดภาพกล้องแล้ว แบบเต็มจอ (ปรับได้ที่ตั้งค่า > ภาพกล้องใน VR Box)', 4500); }   // asking for the camera must show the camera
  invalidateUI();
}
function toggleSplit(){
  S.stereo = !S.stereo;
  if (S.stereo){            // bigger menus in the VR box so the text is readable
    S._ps0 = S.pscale; S._ds0 = dock.mesh.scale.x;
    S.pscale = Math.max(S.pscale, 1.9); dock.mesh.scale.setScalar(Math.max(dock.mesh.scale.x, 1.35));
  } else {
    if (S._ps0) S.pscale = S._ps0;
    if (S._ds0) dock.mesh.scale.setScalar(S._ds0);
  }
  UITEX.forEach(applyTexFilter); applyQuality(); refreshBackground(); invalidateUI();
}
const SEPS = [0, 0.04, 0.08, 0.12, 0.16, 0.20];
function cycleSep(){
  let bi = 0; SEPS.forEach((v, i) => { if (Math.abs(v - S.sep) < Math.abs(SEPS[bi] - S.sep)) bi = i; });
  S.sep = SEPS[(bi + 1) % SEPS.length]; savePrefs(); invalidateUI();
  showToast('ระยะภาพซ้าย-ขวา ' + Math.round(S.sep*100) + '% (ถ้ายังเห็นซ้อน ลองเพิ่ม/ลด)', 3500);
}
function cyclePT(){ S.ptI = (S.ptI + 1) % PTS.length; savePrefs(); refreshBackground(); invalidateUI(); showToast('ภาพกล้องใน VR Box: ' + PT_N[S.ptI] + (PTS[S.ptI] < 0 ? ' (ไม่มีดีเลย์ ลดเวียนหัวสุด)' : ''), 3500); }
function cycleCM(){ S.cmI = (S.cmI + 1) % CMS.length; savePrefs(); invalidateUI(); showToast('กันเวียนหัว (ขอบมืดตอนหันหัว): ' + CM_N[S.cmI], 3000); }
function cycleCQ(){
  S.cqI = (S.cqI + 1) % CQS.length; savePrefs(); invalidateUI();
  if (N.track) N.track.applyConstraints({width:{ideal:CQS[S.cqI][0]}, height:{ideal:CQS[S.cqI][1]}, frameRate:{ideal:60, min:24}}).catch(() => {});
  showToast('ความละเอียดกล้อง ' + CQS[S.cqI][2] + (S.cqI === 1 ? ' (ถ้ากระตุก ลดลง)' : ''), 3500);
}
function cycleCF(){ S.cfI = (S.cfI + 1) % CAMFOVS.length; savePrefs(); invalidateUI(); showToast('มุมกล้องจริง ' + CAMFOVS[S.cfI] + '° (ปรับจนภาพจริงขนาดตรงกับตาเห็น)', 4000); }
function cycleVF(){ S.vfI = (S.vfI + 1) % VFOVS.length; savePrefs(); resize(); invalidateUI(); showToast('มุมมอง VR ' + VFOVS[S.vfI] + '°', 3000); }
function cycleIPD(){ S.ipd = IPDS[(IPDS.indexOf(S.ipd)+1) % IPDS.length]; savePrefs(); invalidateUI(); }
function cycleQuality(){ S.qi = (S.qi + 1) % QUAL.length; applyQuality(); savePrefs(); invalidateUI(); }
function zoomPanel(f){ S.pscale = clamp(S.pscale*f, PS_MIN, PS_MAX); }
function showToast(msg, ms){
  N.msg = msg; N.msgUntil = performance.now() + (ms || 3500);
  if (typeof toast !== 'undefined'){ toast.dirty = true; toast.mesh.visible = true; }
}
function buildIntent(a){
  const link = (a.link || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link)) return null;
  const m = link.match(/^([a-z][a-z0-9+.\-]*):\/\/(.*)$/i);
  if (!m || !a.pkg) return link;
  const fb = 'https://play.google.com/store/apps/details?id=' + a.pkg;
  return 'intent://' + m[2] + '#Intent;scheme=' + m[1].toLowerCase() + ';package=' + a.pkg + ';S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
}
// Chrome only follows intent: links right after a real touch, so a hand gesture alone may be refused
function go(url){
  if (!NATIVE.ok && navigator.userActivation && !navigator.userActivation.isActive){
    N.pending = url; showToast('แตะจอ 1 ครั้งเพื่อเปิดแอป', 6000); return;
  }
  window.location.href = url;
}
function launchApp(a){
  const u = buildIntent(a);
  if (!u){ showToast('ลิงก์แอปไม่ถูกต้อง'); return; }
  showToast('กำลังเปิด ' + a.n + '…', 2500);
  go(u);
}
function addApp(){
  vrPrompt('ชื่อแอป (เช่น YouTube)', n => vrPrompt('ชื่อแพ็กเกจ (เว้นว่างได้) เช่น com.google.android.youtube', pkg => vrPrompt('ลิงก์ที่แอปรองรับ เช่น https://www.youtube.com/', link => addAppDone(n, pkg, link))));
}
function addAppDone(n, pkg, link){
  n = (n || '').trim(); pkg = (pkg || '').trim(); link = (link || '').trim();
  if (!n) return;
  if (!link || BLOCKED_SCHEMES.test(link) || !/^[a-z][a-z0-9+.\-]*:\/\//i.test(link)){ showToast('ลิงก์ไม่ถูกต้อง'); return; }
  customApps.push({n, pkg, link, i:'📱', custom:true}); saveList('pvr_apps', customApps); invalidateUI();
}
// confirm() does not exist inside the APK: ask twice within 4 seconds instead
let confirmKey = '', confirmT = 0;
function confirmTwice(key, msg, fn){
  const now = performance.now();
  if (confirmKey === key && now - confirmT < 4000){ confirmKey = ''; fn(); return; }

function curvedGeo(wM, hM, R){
  const L = wM / R;
  const g = new THREE.CylinderGeometry(R, R, hM, 32, 1, true, Math.PI - L/2, L);

}

    const d = probeCtx.getImageData(0, 0, 32, 18).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;

  l.push(dock.mesh);
  wins.forEach(w => { if (w.ui.mesh.visible) l.push(w.ui.mesh); });
  if (S.mode === 'shoot') l.push(...targets);
  else if (S.mode === 'gallery') l.push(...galleryItems);
  return l;
}
function interactOne(now, dt, hi){
  const gazeOn = P.gaze === 1 || (P.gaze === 2 && S.stereo);
  let p = null, click = false, dwell = false, pinchDown = false, fistDown = false;
  if (hi === 0 && tap){ p = S.stereo ? {x:0, y:0} : tap; click = true; tap = null; }
  else if (H.ok){ p = H.fist ? {x:H.px, y:H.py} : H; pinchDown = H.pinch && !wasPinch; fistDown = H.fist && !wasFist; click = pinchDown; }
  else if (gazeOn && hi === 0 && !HANDS[1].ok){ p = {x:0, y:0}; dwell = true; }
  const pinching = H.ok && H.pinch, fisting = H.ok && H.fist;
  wasPinch = pinching; wasFist = fisting;

  if (!p){                      // nothing is pointing (no hand, centre cursor off): hide the cursor and clear hover
    if (sw && sw.kind === 'touch') sw.reg.touch.up(sw.cx, sw.cy);
    grab = null; sw = null; cursor.visible = false; hoverKey = null; hoverT = 0;
    return;
  }
  cursor.visible = true;
  ray.setFromCamera(p, camera);

  // --- dragging the panel / dock, or resizing the panel ---
  if (grab){
    const alive = grab.kind === 'fist' ? fisting : pinching;
    const gw = typeof grab.target === 'object';
    const gu = gw ? grab.target.ui : (grab.target === 'dock' ? dock : panel);
    if (!alive){
      grab = null;
    } else {
      const r = rayYawY(grab.R);
      if (gw){
        const wn = grab.target;
        if (grab.type === 'resize'){
          const w0 = wn.d.w/520*grab.s0, h0 = wn.d.h/520*grab.s0, dx = (r.yaw - grab.rayYaw)*grab.R, dy = r.y - grab.rayY;
          wn.s = clamp(grab.s0 * (1 + 0.5*(dx/(w0/2) - dy/(h0/2))), 0.5, 2.5); wn.ui.mesh.scale.setScalar(wn.s);
        } else {
          wn.pivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
          wn.ui.mesh.position.y = clamp(grab.y0 + (r.y - grab.rayY), -1, 1);
        }
      } else if (grab.type === 'resize'){
        const w0 = BASE_W*grab.s0, h0 = BASE_H*grab.s0;
        const dx = (r.yaw - grab.rayYaw)*grab.R, dy = r.y - grab.rayY;
        S.pscale = clamp(grab.s0 * (1 + 0.5*(dx/(w0/2) - dy/(h0/2))), PS_MIN, PS_MAX);
      } else if (grab.target === 'panel'){
        panelPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        panelPivot.position.y = clamp(grab.y0 + (r.y - grab.rayY), -0.5, 1.0);
      } else {
        dockPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        dock.mesh.position.y = clamp(grab.y0 + (r.y - grab.rayY), -1.1, 0.5);
      }
      const hid = grab.type === 'resize' ? 'resize' : (grab.target === 'dock' ? 'dockbg' : 'grab');
      hoverReqs.push({ui:gu, h:hid, pr:hid});
      ray.ray.at(grab.R, cursor.position);
      cursor.material.color.set(0x39e08a); cursor.scale.setScalar(1);
      return;
    }
  }

  if (sw){
    if (!pinching){
      const q = sw; sw = null;
      if (q.kind === 'touch') q.reg.touch.up(q.cx, q.cy);
      if (q.kind === 'press' && !q.cancel && q.reg && q.reg.fn && now > cool){ cool = now + 350; q.reg.fn(); }   // select on release
    } else if (sw.kind === 'press'){
      const dx = p.x - sw.x0, dy = p.y - sw.y0;
      if (sw.ui === panel && !sw.paged && Math.abs(dx) > 0.22 && Math.abs(dx) > Math.abs(dy)*1.3){
        sw.paged = true; sw.cancel = true; S.page += dx < 0 ? 1 : -1; panel.dirty = true;                       // swipe = flip page
      } else if (Math.hypot(dx, dy) > 0.3) sw.cancel = true;
    } else if (sw.kind === 'touch'){                      // pinch held on a web page: follow the finger so the page scrolls
      const th = ray.intersectObject(sw.ui.mesh, false)[0];
      if (th){ sw.cx = th.uv.x * sw.ui.W; sw.cy = (1 - th.uv.y) * sw.ui.H; sw.reg.touch.move(sw.cx, sw.cy); }
    } else if (sw.kind === 'look'){
      const k = THREE.MathUtils.degToRad(camera.fov) / 2 * 1.5;
      v360.yaw = sw.yaw0 - (p.x - sw.x0) * k * camera.aspect;
      v360.pitch = clamp(sw.pitch0 + (p.y - sw.y0) * k, -1.4, 1.4);
    }
  }
  const list = activeList();
  const hit = ray.intersectObjects(list, false)[0];
  const obj = hit ? hit.object : null;
  const ui = obj && obj.userData.ui ? obj.userData.ui : null;
  const reg = ui ? ui.at(hit.uv) : null;

  if (ui && reg) hoverReqs.push({ui, h:reg.id, pr:pinching ? reg.id : null});
  if (obj && !ui) hovObjs.push(obj);

  // a fist closed anywhere over the panel or dock grabs it
  if (fistDown && ui) startGrab('fist', ui === dock ? 'dock' : (ui.win || 'panel'), 'move');

  const fn = ui ? (reg && reg.fn) : (obj && obj.userData.onClick);
  const key = (obj && (ui ? (reg && reg.fn ? obj.id + ':' + reg.id : null) : String(obj.id))) || null;
  if (dwell){
    if (key && key === hoverKey) hoverT += dt; else hoverT = 0;
    if (key && hoverT > 1.0){ click = true; hoverT = 0; }
  } else hoverT = 0;
  hoverKey = key;

  if (click && now > cool && !grab){
    if (pinchDown && ui === panel && reg && reg.id === 'grab') startGrab('pinch', 'panel', 'move');
    else if (pinchDown && ui === panel && reg && reg.id === 'resize') startGrab('pinch', 'panel', 'resize');
    else if (pinchDown && ui === dock && reg && reg.id === 'dockbg') startGrab('pinch', 'dock', 'move');
    else if (pinchDown && ui && ui.win && reg && (reg.id === 'grab' || reg.id === 'resize')) startGrab('pinch', ui.win, reg.id === 'grab' ? 'move' : 'resize');
    else if (ui && reg && reg.touch){
      const cx = hit.uv.x * ui.W, cy = (1 - hit.uv.y) * ui.H, tr = reg.touch;
      if (pinchDown) sw = {kind:'touch', ui, reg, cx, cy};
      else cool = now + 350;                              // screen tap / gaze dwell: a quick tap
      tr.down(cx, cy);
      if (!pinchDown) setTimeout(() => tr.up(cx, cy), 70);
    }
    else if (fn){
      if (pinchDown && ui) sw = {kind:'press', ui, reg, x0:p.x, y0:p.y, cancel:false};       // pinch: decide on release (tap vs swipe)
      else { cool = now + 350; fn(); }
    }
  }
  if (pinchDown && !sw && !grab){
    if (ui === panel && !reg) sw = {kind:'press', ui, reg:null, x0:p.x, y0:p.y, cancel:false};
    else if (S.mode === 'v360' && !obj) sw = {kind:'look', x0:p.x, y0:p.y, yaw0:v360.yaw, pitch0:v360.pitch};
  }

  if (hit) cursor.position.copy(hit.point).addScaledVector(ray.ray.direction, -0.03);
  else ray.ray.at(PANEL_R, cursor.position);
  cursor.material.color.set(H.ok ? (H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff)) : 0xffd24a);
  cursor.scale.setScalar(1 + hoverT*2);
}

const NEWCTX = () => ({grab:null, sw:null, wasPinch:false, wasFist:false, hoverKey:null, hoverT:0, cool:0});
function applyHover(){
  hovUI = null;
  allUIs().forEach(u => {
    let h = null, pr = null;
    for (const q of hoverReqs){ if (q.ui !== u) continue; if (h === null || (q.pr && !pr)){ h = q.h; pr = q.pr; } }
    if (h && !hovUI) hovUI = u;
    if (u.hover !== h || u.press !== pr){ u.hover = h; u.press = pr; u.dirty = true; }
  });
  activeList().forEach(o => {
    if (o.userData.ui) return;
    const sc = hovObjs.includes(o) ? 1.12 : 1;
    o.scale.x += (sc - o.scale.x)*0.3; o.scale.y = o.scale.z = o.scale.x;
  });
}
function interact(now, dt){
  hoverReqs.length = 0; hovObjs.length = 0;
  if (ZM){                                  // two-hand zoom: whatever the cursor was over (window / dock / panel), else the panel or the 360 view
    const z = ZM;
    if (z.b === null){
      z.t = hovUI || (S.mode === 'v360' ? 'fov' : (panel.mesh.visible ? panel : null));
      z.b = z.t === 'fov' ? v360.fov : z.t === panel ? S.pscale : (z.t ? z.t.mesh.scale.x : 1);
    }
    if (z.t === 'fov') v360.fov = clamp(z.b / z.k, 25, 100);
    else if (z.t === panel) S.pscale = clamp(z.b * z.k, PS_MIN, PS_MAX);
    else if (z.t){
      const ns = clamp(z.b * z.k, z.t === dock ? 0.6 : 0.5, z.t === dock ? 2.2 : 2.5);
      z.t.mesh.scale.setScalar(ns); if (z.t.win) z.t.win.s = ns;
    }
    for (let i = 0; i < 2; i++){ CTX[i] = NEWCTX(); CURS[i].visible = false; CTX[i].wasPinch = true; }
    applyHover();
    return;
  }
  for (let i = 0; i < 2; i++){
    H = HANDS[i]; F = H.F; cursor = CURS[i];
    ({grab, sw, wasPinch, wasFist, hoverKey, hoverT, cool} = CTX[i]);
    if (i === 1 && !H.ok){ cursor.visible = false; CTX[1] = NEWCTX(); continue; }
    interactOne(now, dt, i);
    CTX[i] = {grab, sw, wasPinch, wasFist, hoverKey, hoverT, cool};
  }
  H = HANDS[0]; F = H.F; cursor = CURS[0];
  applyHover();
}

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = (S.stereo ? w/2 : w) / h;
  camera.fov = baseFov(); if (S.mode === 'v360') v360.fov = camera.fov;
  camera.updateProjectionMatrix();
  hud.style.display = S.stereo ? 'none' : 'block';
}
// crop the camera picture to the viewport shape instead of stretching it
function fitBackground(aspect){
  const tex = scene.background;
  if (!tex || !tex.isTexture) return;
  const el = tex === boostTex ? boostCv : video;
  const va = (el.videoWidth || el.width || 16) / (el.videoHeight || el.height || 9);
  let rx = 1, ry = 1;
  if (aspect < va) rx = aspect / va; else ry = va / aspect;
  tex.repeat.set(rx, ry); tex.offset.set((1 - rx)/2, (1 - ry)/2);
}
function render(){
  const w = innerWidth, h = innerHeight;
  fitBackground(camera.aspect);
  if (S.stereo){
    camera.focus = PANEL_R;   // menus sit at zero parallax (identical in both eyes) = no double vision on them
    camera.updateMatrixWorld(); stereo.eyeSep = S.ipd; stereo.update(camera);
    // each eye's picture is moved toward the middle so its centre sits in front of the lens (phone screen halves are wider apart than your eyes)
    const d = Math.round(S.sep * w/2);
    renderer.setScissorTest(true);
    renderer.setViewport(d, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.render(scene, stereo.cameraL);
    renderer.setViewport(w/2 - d, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.render(scene, stereo.cameraR);
    renderer.setScissorTest(false);
  } else {
    renderer.setViewport(0, 0, w, h); renderer.render(scene, camera);
  }
}
let last = 0, fpsN = 0, fpsT = 0, lowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last)/1000, 0.1); last = now;
  if (N.webOpen && !N.webFloat) return;                 // the browser overlay covers the scene: pause the 3D work
  camera.quaternion.copy(devQ); camera.updateMatrixWorld(true);
  updateVignette(dt);
  updateLight(now);
  if (N.boosting && S.mr && video.currentTime !== N.drawnVT) boostFrame();
  updateHands(now);
  easeCursor(dt);
  interact(now, dt);
  syncPanelGeo();
  updateHandViz(0); updateHandViz(1);
  if (toast.mesh.visible){
    if (now > N.msgUntil) toast.mesh.visible = false;
    else toast.mesh.position.set(0, dock.mesh.position.y + 0.24, -DOCK_R + 0.02);
  }
  wins.forEach(w => {
    if (!w.ui.mesh.visible) return;
    if (w.tick && now - w.lt > w.tick){ w.lt = now; w.ui.dirty = true; }
    if (w.vmat && videoTex && !w.vmat.map){ w.vmat.map = videoTex; w.vmat.color.set(0xffffff); w.vmat.needsUpdate = true; w.ui.dirty = true; }
  });
  if (NB.open && NB.cv && winOpen('nweb')) pollNweb(now);
  if (ptMesh.visible) updatePtSize();
  if (S.mode === 'v360'){
    v360g.rotation.set(v360.pitch, v360.base + v360.yaw, 0);
    if (Math.abs(camera.fov - v360.fov) > 0.05){ camera.fov = v360.fov; camera.updateProjectionMatrix(); }
  }
  [panel, dock, toast].concat(wins.map(w => w.ui)).forEach(u => { if (u.dirty && u.mesh.visible && now - (u.lastDraw || 0) > 90){ u.lastDraw = now; u.redraw(); } });

  if (S.mode === 'shoot'){
    spawnAcc += dt; if (spawnAcc > 1.1){ spawnAcc = 0; spawnTarget(); }
    targets.slice().forEach(t => { if (now - t.userData.born > 7000) popTarget(t); });
  } else if (S.mode === 'gallery'){
    galleryItems.forEach(m => { m.rotation.y += dt*m.userData.spd; m.rotation.x += dt*0.3*m.userData.spd; });
  }
  render();

  fpsN++; fpsT += dt;
  if (fpsT > 0.5){
    hud.textContent = VERSION + (NATIVE.ok ? '-apk' : '') + ' | ' + Math.round(fpsN/fpsT) + ' fps | hand: ' + (H.ok ? (H.fist ? 'fist' : (H.pinch ? 'pinch' : 'ok')) : 'none') + ' (' + delegate + ', det ' + D.ms.toFixed(0) + 'ms/' + (detGap ? Math.round(1000/Math.max(detGap,1)) : 0) + 'Hz)\nmode: ' + S.mode + ' | q: ' + QNAMES[S.qi] + ' | ui x' + S.pscale.toFixed(2) + '\nlight ' + Math.round(N.lum) + ' x' + N.gain.toFixed(1) + (N.torchOn ? ' | torch' : '') + (gotOrient ? '' : ' | no gyro') + (ZM ? ' | ซูม' : '') + (HANDS[1].ok ? ' | 2 มือ' : '') + '\nสองมือ: ' + (P.two ? 'เปิด' : 'ปิด') + ' | เจอมือ ' + (H.ok ? (H.n || 0) : 0) + (delegate === '-' ? '\nกำลังโหลดโมเดลมือ…' : '') + (delegate === 'fail' ? '\nโหลดโมเดลมือไม่ได้: ' + initErr.slice(0, 90) : '');
    const fpsNow = fpsN/fpsT;
    if (fpsNow < 20 && S.qi > (S.stereo ? 1 : 0) && S.cam !== undefined){ lowT += 0.5; if (lowT >= 2.5){ S.qi--; applyQuality(); savePrefs(); invalidateUI(); lowT = 0; } } else lowT = 0;
    fpsN = 0; fpsT = 0;
  }
}

/* ---------- start ---------- */
addEventListener('resize', resize);

// browser overlay buttons
$('wgo').onclick = () => openWeb($('wurl').value);
$('wurl').addEventListener('keydown', e => { if (e.key === 'Enter') openWeb($('wurl').value); });
$('wh').onclick = () => { if (N.webUrl) $('wframe').src = N.webUrl; };
$('wx').onclick = () => { window.open($('wurl').value || N.webUrl, '_blank', 'noopener'); };
$('wc').onclick = closeWeb;
$('wf').onclick = () => {
  N.webFloat = (N.webFloat + 1) % 3;
  $('web').classList.toggle('fl1', N.webFloat === 1); $('web').classList.toggle('fl2', N.webFloat === 2);
};
document.addEventListener('pointerdown', () => { if (N.pendingFn) N.swallow = true; }, true);
document.addEventListener('click', () => {
  if (!N.pendingFn) return;
  const fn = N.pendingFn; N.pendingFn = null; N.swallow = false; fn();
}, true);

// a real touch right after a hand-triggered launch lets Chrome follow the Android link
document.addEventListener('pointerdown', () => {
  if (!N.pending) return;
  const u = N.pending; N.pending = null; N.swallow = true;
  setTimeout(() => { N.swallow = false; }, 80);
  window.location.href = u;
}, true);

// coming back from another app: restart the camera and screen lock
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.cam) return;
  try{ if (N.track && N.track.readyState === 'ended') await initCamera(); else await video.play(); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
});
$('go').onclick = async () => {
  $('msg').textContent = 'กำลังเริ่ม...';
  try{ if (DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  addEventListener('deviceorientation', onOrient, true);
  try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
  await initCamera();
  initHands();
  nativeInit();
  $('start').remove();
  groups.shoot.visible = false; groups.gallery.visible = false; panel.mesh.visible = true;
  applyQuality(); recenterHeading(); drawScore(); invalidateUI();
  requestAnimationFrame(frame);
};
</script>
