name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle hand-tracking files into the app (works offline)
        run: |
          set -e
          A="$GITHUB_WORKSPACE/app/src/main/assets/mp"
          mkdir -p "$A" /tmp/mp
          cd /tmp/mp
          for i in 1 2 3 4; do npm pack @mediapipe/tasks-vision@0.10.14 && break; sleep 20; done
          tar xzf mediapipe-tasks-vision-0.10.14.tgz
          cp package/vision_bundle.mjs "$A/"
          cp -r package/wasm "$A/wasm"
          curl -fL --retry 6 --retry-delay 10 -o "$A/hand_landmarker.task" \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la "$A" "$A/wasm"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          # Maven Central sometimes answers 429 (too many requests) to shared CI machines, so retry a few times
          for i in 1 2 3 4; do
            gradle --no-daemon assembleDebug && exit 0
            echo "build attempt $i failed, waiting before retry"; sleep $((i * 45))
          done
          # safety net 1: if only the new native VR screen breaks the build, replace it with an empty stub
          echo "falling back: stub for the native VR screen"
          D=app/src/main/java/com/pocketvr/app
          rm -f $D/NvCam.java $D/NvHands.java $D/VRRenderer.java $D/NvUi.java
          cat > $D/NativeVRActivity.java <<'STUB'
          package com.pocketvr.app;
          public class NativeVRActivity extends android.app.Activity {
              @Override protected void onCreate(android.os.Bundle b) { super.onCreate(b); finish(); }
          }
          STUB
          gradle --no-daemon assembleDebug && echo "NOTE=หน้าจอ VR เนทีฟคอมไพล์ไม่ผ่าน (ปิดไว้)" >> "$GITHUB_ENV" && exit 0
          # safety net 2: if the native hand model code is what breaks the build, ship the app without it (the page keeps its own detection)
          echo "falling back to a build without the native hand model"
          cp app/fallback/NativeHands.java.txt app/src/main/java/com/pocketvr/app/NativeHands.java
          sed -i "/tasks-vision/d" app/build.gradle
          gradle --no-daemon assembleDebug && echo "NOTE=ไม่มีตัวตรวจเนทีฟ (โค้ดเนทีฟคอมไพล์ไม่ผ่าน)" >> "$GITHUB_ENV" && exit 0
          exit 1

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PocketVR.apk
          gh release create "build-${{ github.run_number }}" PocketVR.apk \
            --title "PocketVR build ${{ github.run_number }}" \
            --notes "Download PocketVR.apk and install it. ${NOTE:-}" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PocketVR-apk
          path: PocketVR.apk
